<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jovian Drift SOS</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
    <iframe id="bg-frame" src="./styles/effect.html"></iframe>

    <form method="post" action="#">
        <fieldset>
            <legend>Pilot Credentials</legend>
            <label for="pilot-name">Pilot Name:</label>
            <input type="text" id="pilot-name" name="pilot_name" required placeholder="Enter name">
            <label for="access">Access Code:</label>
            <input type="password" id="access" name="access_code" required>
            <label for="email">Command Email:</label>
            <input type="email" id="email" name="email" required>
        </fieldset>
        <button type="submit">INITIATE TRANSMISSION</button>
        <button type="reset">RESET SYSTEM</button>
        <fieldset>
            <legend>Vessel Diagnostics</legend>
            <label for="damage">Hull Damage (%):</label>
            <input type="number" id="damage" name="hull_damage" required>
            <label for="emergency">Emergency Level:</label>
            <select name="emergency_level" id="emergency" required>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>
        </fieldset>
        <button type="submit">INITIATE TRANSMISSION</button>
        <button type="reset">RESET SYSTEM</button>
        <fieldset>
            <legend>Mission Log & Evidence</legend>
            <label for="SOS">SOS Message:</label>
            <textarea name="SOS_message" id="SOS" required rows="3"></textarea>
            <div>
                <input type="checkbox" id="quarantine" name="checkbox" required>
                <label for="quarantine">I agree to quarantine protocols.</label>
            </div>
        </fieldset>
        <button type="submit">INITIATE TRANSMISSION</button>
        <button type="reset">RESET SYSTEM</button>
    </form>
    
    <script src="./scripts/launch.js"></script>
</body>
</html>
